name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python tools/run_tests.py
      - run: igd demo
      - run: igd validate-plan examples/shaft_plan.json
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/package_release.py
  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[cad]"
      - run: python tools/run_tests.py
      - run: python examples/export_demo.py
