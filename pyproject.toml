[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "igd-framework"
version = "0.2.1"
description = "Agent coordination and workflow interfaces for Intelligent Generative Design"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "IGD contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
cad = ["cadquery>=2.8,<3"]

[project.scripts]
igd = "igd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

